<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Biblioteca Ducky · Modificar usuario</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>

    <body class="user-edit-page">

        <div class="app">
            <!-- Sidebar and topbar are drawn by Layout according to the profile -->
            <aside id="sidebar" class="sidebar"></aside>
            <main class="main">
                <header id="topbar" class="topbar"></header>
                <div id="contenido">
                    <div class="page-header user-edit-header">
                        <div>
                            <h1 id="titulo-pagina">Modificar perfil del usuario</h1>
                            <p id="descripcion-pagina">Busca por Clave o Nombre. Los datos institucionales son de solo lectura.</p>
                        </div>
                    </div>
                    <div id="mensaje"></div>
                    <div id="formulario-editar">
                        <div class="card user-edit-card">
                            <h2 id="usuario-titulo">Selecciona un usuario</h2>
                            <div class="grid-2">
                                <div class="field"><label for="buscar-clave">Buscar por Clave o Nombre</label>
                                    <input id="buscar-clave" type="search" autocomplete="off" placeholder="Clave o nombre"></div>
                                <div class="field"><span class="label">Perfil asignado</span><div class="readonly" id="dato-perfil"></div></div>
                                <div class="field"><span class="label">Clave</span><div class="readonly" id="dato-clave"></div></div>
                                <div class="field"><span class="label">Nombre</span><div class="readonly" id="dato-nombre"></div></div>
                                <div class="field"><span class="label">Tipo de usuario</span><div class="readonly" id="dato-tipo"></div></div>
                                <div class="field"><span class="label">Correo institucional</span><div class="readonly" id="dato-correo"></div></div>
                                <div class="field"><span class="label">Teléfono institucional</span><div class="readonly" id="dato-telefono">No registrado</div></div>
                                <div class="field"><label for="nuevo-perfil">Nuevo perfil</label><select id="nuevo-perfil" disabled>
                                    <option value="">Elige un perfil</option></select></div>
                            </div>
                        </div>
                        <div id="coincidencias-editar"></div>
                        <div class="actions user-edit-actions">
                            <button class="btn btn-primary" id="btn-guardar" type="button" disabled>Guardar cambio de perfil</button>
                            <button class="btn btn-primary" id="btn-reactivar" type="button" hidden>Reactivar usuario</button>
                            <a class="btn" href="usuarios.html">Cancelar</a>
                        </div>
                    </div>
                    <div id="resultado-editar"></div>
                </div>
            </main>
        </div>

        <!-- Utilities -->
        <script src="js/utils/api.js"></script>
        <script src="js/utils/session.js"></script>
        <script src="js/utils/ui.js"></script>
        <script src="js/utils/layout.js"></script>

        <!-- MVC layer of this page -->
        <script src="js/models/UsuarioModel.js"></script>
        <script src="js/views/UsuarioEditarView.js"></script>
        <script src="js/controllers/UsuarioEditarController.js"></script>
        <script>
            usuario_editar_controller.iniciar();

        </script>

    </body>

</html>
